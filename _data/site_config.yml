frontpage_cards:
  - title: Δείκτες και Δεδομένα
    content: >-
      Παρακολούθηση της προόδου μέσα από επιλεγμένους ιδρυματικούς δείκτες,
      γραφήματα, πίνακες και ανοικτά δεδομένα. Η πλατφόρμα μπορεί να υποστηρίξει
      δεδομένα ανά έτος, Στόχο Βιώσιμης Ανάπτυξης, Σχολή, Τμήμα ή θεματική
      περιοχή.
    button_label: Προβολή δεικτών
    button_link: goals
    rule_color: '#B03931'
    include: ''
  - title: Πολιτικές και Τεκμηρίωση
    content: >-
      Σύνδεση κάθε Στόχου με πολιτικές, δράσεις, αποφάσεις, εκθέσεις και
      τεκμήρια του Πανεπιστημίου. Η προσέγγιση μετατρέπει τις υπάρχουσες σελίδες
      πολιτικών σε οργανωμένο σύστημα τεκμηρίωσης και παρακολούθησης.
    include: ''
    button_label: Δείτε τους στόχους
    button_link: goals
    rule_color: '#404041'
  - title: Στρατηγική και Κοινωνικό Αποτύπωμα
    content: >-
      Ανάδειξη της συμβολής του Πανεπιστημίου στη βιωσιμότητα, την κοινωνική
      ευθύνη, την καινοτομία και την περιφερειακή ανάπτυξη. Το Παρατηρητήριο
      μπορεί να λειτουργήσει ως εργαλείο στρατηγικού σχεδιασμού, δημόσιας
      λογοδοσίας και διεθνούς προβολής.
    include: ''
    button_label: Κατάσταση αναφοράς
    button_link: reporting-status
    rule_color: '#B03931'
