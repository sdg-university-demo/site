create_goals:
  previous_next_links: true
  goals:
    - goal: 3
      heading: SDG 3 – Καλή Υγεία και Ευημερία
      content_heading: Συμβολή του Πανεπιστημίου
      content: >-
        Το Πανεπιστήμιο Θεσσαλίας συμβάλλει στον Στόχο 3 μέσα από την
        εκπαίδευση, την έρευνα και τις δράσεις που σχετίζονται με την υγεία, την
        ευημερία, την πρόληψη και τη δημόσια υγεία. Η συμβολή του αποτυπώνεται
        μέσα από δείκτες που αφορούν προγράμματα σπουδών επιστημών υγείας,
        ερευνητικά έργα, συνεργασίες με φορείς, υπηρεσίες φοιτητικής μέριμνας,
        δράσεις ψυχικής υγείας και πολιτικές πρόληψης.
    - goal: 13
      heading: SDG 13 – Δράση για το Κλίμα
      content_heading: Συμβολή του Πανεπιστημίου
      content: >-
        Ο Στόχος 13 αφορά την κλιματική δράση, την περιβαλλοντική υπευθυνότητα
        και την ανθεκτικότητα απέναντι στις επιπτώσεις της κλιματικής κρίσης. Η
        συμβολή του Ιδρύματος μπορεί να τεκμηριωθεί μέσα από ερευνητικά έργα,
        πολιτικές ενεργειακής διαχείρισης, δράσεις περιβαλλοντικής
        ευαισθητοποίησης, μελέτες για φυσικές καταστροφές και συνεργασίες για
        την κλιματική ανθεκτικότητα της Θεσσαλίας και της ευρύτερης περιοχής της
        Μεσογείου.
  goal_content_heading: Συμβολή του Πανεπιστημίου
