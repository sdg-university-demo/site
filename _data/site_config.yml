reporting_status:
  title: Κατάσταση τεκμηρίωσης δεικτών
  description: >-
    Η ενότητα παρουσιάζει την κατάσταση διαθεσιμότητας και τεκμηρίωσης των
    δεικτών που συνδέονται με τους Στόχους Βιώσιμης Ανάπτυξης. Κάθε δείκτης
    μπορεί να βρίσκεται σε διαφορετικό στάδιο ωρίμανσης, ανάλογα με τη
    διαθεσιμότητα δεδομένων, μεταδεδομένων και θεσμικών πηγών τεκμηρίωσης.
  disaggregation_tabs: false
  status_types:
    - value: complete
      label: Διαθέσιμα δεδομένα και τεκμηρίωση
      hide_on_goal_pages: false
    - value: inprogress
      label: Σε εξέλιξη συλλογή δεδομένων
      hide_on_goal_pages: false
    - value: notstarted
      label: Υπό ανάπτυξη / αναζήτηση πηγών
      hide_on_goal_pages: false
    - label: Μη εφαρμόσιμο / υπό αξιολόγηση
      value: notapplicable
  disaggregation_indicator_count_label: δείκτες
